networks:
  postgres:

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    environment:
      OPENAI_API_KEY:
      PINECONE_API_KEY:
      DATABASE_URL: postgres://user:password@db:5432/mydatabase
      SEQ_URL: http://seq:5341
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - postgres
    links:
      - db

  db:
    image: postgres:13
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    depends_on:
      - seq
    networks:
      - postgres

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
      - "5342:5342"
    environment:
      ACCEPT_EULA: Y
    networks:
      - postgres

